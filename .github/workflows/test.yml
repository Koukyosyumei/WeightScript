name: Tests
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
  python:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      WEIGHTSCRIPT_UPSTREAM: /tmp/weightscript-upstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,research]' ruff
      - run: python -m pip install 'tracr @ git+https://github.com/google-deepmind/tracr@9ce2b8c82b6ba10e62e86cf6f390e7536d4fd2cd'
      - run: git clone https://github.com/lacoco-lab/decompiling_transformers /tmp/weightscript-upstream
      - run: git -C /tmp/weightscript-upstream checkout 787398b0f4393a90ad02cd8e71be48d1e85d2b21
      - run: ruff check --select E9,F python examples
      - run: ruff format --check python examples
      - run: pytest -q

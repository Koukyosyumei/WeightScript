[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightscript"
version = "0.2.0"
requires-python = ">=3.10"
description = "Inspect, edit, compile and audit trained Transformer circuits without gradients"
dependencies = ["torch>=2.2", "transformers==4.57.1", "safetensors>=0.4", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
research = ["jax[cpu]==0.4.35", "dm-haiku==0.0.13", "chex==0.1.90", "einops>=0.8", "networkx>=3", "matplotlib>=3.8", "accelerate>=1", "click>=8", "z3-solver>=4.13"]

[project.scripts]
weightscript = "weightscript.workbench:main"
weightscript-hf = "weightscript.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
